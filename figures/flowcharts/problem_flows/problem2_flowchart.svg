<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="450" viewBox="0 0 1750 450">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
  </marker>
  <style>
    .title{font:700 28px "Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
    .boxtext{font:600 21px "Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
    .small{font:500 17px "Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
    .engsmall{font:500 17px "Times New Roman","Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
    .formula{font:italic 19px "Times New Roman","Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
    .box{fill:#ffffff;stroke:#172554;stroke-width:2.2}
    .round{fill:#ffffff;stroke:#172554;stroke-width:2.2}
    .diamond{fill:#ffffff;stroke:#172554;stroke-width:2.2}
    .arrow{fill:none;stroke:#111827;stroke-width:2.2;marker-end:url(#arrow)}
    .label{font:600 18px "Noto Serif CJK SC","Songti SC","SimSun","Microsoft YaHei",serif;fill:#111827}
  </style>
</defs>
<rect width="1750" height="450" fill="#ffffff"/>
<text x="875" y="42" text-anchor="middle" class="title">图2  问题二流程图</text>

<rect x="40" y="176" width="140" height="64" rx="32" class="round"/>
<text x="110" y="217" text-anchor="middle" class="boxtext">开始</text>

<rect x="1560" y="166" width="160" height="84" rx="42" class="round"/>
<text x="1640" y="203" text-anchor="middle" class="boxtext">输出</text>
<text x="1640" y="228" text-anchor="middle" class="engsmall">result2.xlsx</text>

<rect x="240" y="165" width="230" height="86" class="box"/>
<text x="355" y="198" text-anchor="middle" class="boxtext">继承问题1模型</text>
<text x="355" y="228" text-anchor="middle" class="small">几何 / 边界 / 数值方法</text>

<rect x="540" y="165" width="260" height="86" class="box"/>
<text x="670" y="198" text-anchor="middle" class="boxtext">引入附录3物性</text>
<text x="670" y="228" text-anchor="middle" class="small">ρ(C), cₚ(C), k(C), D(T,C)</text>

<rect x="900" y="95" width="250" height="86" class="box"/>
<text x="1025" y="128" text-anchor="middle" class="boxtext">温度更新</text>
<text x="1025" y="158" text-anchor="middle" class="formula">C → ρ,cₚ,k → T</text>

<rect x="900" y="250" width="250" height="86" class="box"/>
<text x="1025" y="283" text-anchor="middle" class="boxtext">水分更新</text>
<text x="1025" y="313" text-anchor="middle" class="formula">T,C → D → C</text>

<rect x="1240" y="165" width="220" height="86" class="box"/>
<text x="1350" y="198" text-anchor="middle" class="boxtext">热湿双向耦合</text>
<text x="1350" y="228" text-anchor="middle" class="small">同步 Picard 迭代</text>

